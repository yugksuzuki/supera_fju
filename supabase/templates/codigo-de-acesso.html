<!-- Supabase → Authentication → Emails → "Magic Link". Assunto: Seu código de acesso · SUPERA -->
<div style="font-family:Poppins,Arial,sans-serif;max-width:440px;margin:0 auto;padding:24px;color:#2a1215">
  <h2 style="margin:0 0 8px;color:#b01026">SUPERA · Acompanhamento</h2>
  <p style="margin:0 0 16px">Use este código para entrar:</p>
  <p style="font-size:32px;font-weight:700;letter-spacing:8px;margin:0 0 16px">{{ .Token }}</p>
  <p style="margin:0 0 16px">Ou toque no botão:</p>
  <p><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#d91a36;color:#fff;padding:12px 20px;border-radius:12px;text-decoration:none;font-weight:600">Entrar no sistema</a></p>
  <p style="color:#6f5156;font-size:13px;margin-top:24px">O código vale por 1 hora. Se não foi você que pediu, ignore este e-mail.</p>
</div>
